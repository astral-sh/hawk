name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Validate release
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'astral-sh/hawk' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate tag and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          version = manifest["package"]["version"]
          if tag != version:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## {tag}\n" not in changelog:
              raise SystemExit(f"CHANGELOG.md does not contain an entry for {tag}")
          PY

  build-artifacts:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      HAWK_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Build release binaries
        run: cargo build --release --locked --target "$HAWK_TARGET"
      - name: Check release linkage
        run: ./scripts/check-release-linkage.sh "$HAWK_TARGET"
      - name: Package release binaries
        run: ./scripts/package-release.sh "$HAWK_TARGET"
      - name: Remove compiler development component
        run: rustup component remove rustc-dev
      - name: Smoke test release archive
        env:
          HAWK_SMOKE_ARCHIVE: ${{ runner.temp }}/hawk-release-archive
          HAWK_SMOKE_FIXTURE: ${{ runner.temp }}/hawk-release-smoke
        run: |
          mkdir "$HAWK_SMOKE_ARCHIVE"
          tar -xzf "cargo-hawk-$HAWK_TARGET.tar.gz" -C "$HAWK_SMOKE_ARCHIVE"
          cp -R tests/fixtures/basic "$HAWK_SMOKE_FIXTURE"
          "$HAWK_SMOKE_ARCHIVE/cargo-hawk-$HAWK_TARGET/cargo-hawk" --help
          "$HAWK_SMOKE_ARCHIVE/cargo-hawk-$HAWK_TARGET/cargo-hawk" \
            --manifest-path "$HAWK_SMOKE_FIXTURE/Cargo.toml" \
            -A warnings
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            cargo-hawk-${{ matrix.target }}.tar.gz
            cargo-hawk-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish-crates:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate
      - build-artifacts
    uses: ./.github/workflows/publish-crates.yml
    permissions:
      contents: read
      id-token: write

  announce:
    name: Create GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate
      - build-artifacts
      - publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Create release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md").read_text()
          start = changelog.index(f"## {tag}\n") + len(f"## {tag}\n")
          end = changelog.find("\n## ", start)
          entry = changelog[start:] if end == -1 else changelog[start:end]
          notes = f"## Release Notes\n{entry.rstrip()}\n"
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes)
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}" \
            artifacts/*
